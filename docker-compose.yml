x-netbox: &netbox
  build: ./network
  image: cn-netbox
  cap_add:
    - NET_ADMIN

services:
  client:
    <<: *netbox
    container_name: client
    command: sh -c "ip route replace default via 10.0.1.254 && sleep infinity"
    networks:
      net_a:
        ipv4_address: 10.0.1.10

  router1:
    <<: *netbox
    container_name: router1
    command: sh -c "ip route add 10.0.3.0/24 via 10.0.2.253 && sleep infinity"
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_a:
        ipv4_address: 10.0.1.254
      net_b:
        ipv4_address: 10.0.2.254

  router2:
    <<: *netbox
    container_name: router2
    command: sh -c "ip route add 10.0.1.0/24 via 10.0.2.254 && sleep infinity"
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_b:
        ipv4_address: 10.0.2.253
      net_c:
        ipv4_address: 10.0.3.254

  resolver:
    build:
      context: ./network
      dockerfile: Dockerfile.unbound
    image: cn-unbound
    container_name: resolver
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route add 10.0.1.0/24 via 10.0.2.254 && ip route add 10.0.3.0/24 via 10.0.2.253 && exec unbound -d -c /etc/unbound/unbound.conf"
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      net_b:
        ipv4_address: 10.0.2.10

  server:
    build:
      context: ./network
      dockerfile: Dockerfile.bind
    image: cn-bind
    container_name: server
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route replace default via 10.0.3.254 && mkdir -p /run/named && chown bind:bind /run/named && exec named -g -u bind"
    volumes:
      - ./bind/named.conf:/etc/bind/named.conf:ro
      - ./bind/zones:/etc/bind/zones
    networks:
      net_c:
        ipv4_address: 10.0.3.10

networks:
  net_a:
    ipam:
      config:
        - subnet: 10.0.1.0/24
  net_b:
    ipam:
      config:
        - subnet: 10.0.2.0/24
  net_c:
    ipam:
      config:
        - subnet: 10.0.3.0/24

