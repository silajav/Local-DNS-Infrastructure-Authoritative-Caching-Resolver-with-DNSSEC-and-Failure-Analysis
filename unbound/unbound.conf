server:
    interface: 0.0.0.0
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.1.0/24 allow
    access-control: 10.0.2.0/24 allow
    chroot: ""
    username: ""
    pidfile: ""
    verbosity: 1
    private-domain: "lab.test"
    local-zone: "lab.test." transparent

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

stub-zone:
    name: "lab.test"
    stub-addr: 10.0.3.10
